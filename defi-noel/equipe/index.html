<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défi de Noël — écran de l'équipe | GAMEDOOR·41</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/img/logo/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/defi-noel.css?v=1">
  <style>
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px;margin:18px 0}
    .stat{background:var(--card);border-radius:10px;padding:14px}
    .stat b{display:block;font:800 34px "Barlow Condensed",sans-serif;line-height:1}
    .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
    table{border-collapse:collapse;width:100%;font-size:14px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:var(--card);font-weight:700;white-space:nowrap}
    td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .pt{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .pt button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;font:600 13px Barlow}
    .pt.ok button{background:#e3f4ea;border-color:#9fd3b4}
    .pt.ko button{background:#fde8e8;border-color:#f0b4b4}
    .onglets{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 12px}
    .onglets button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font:600 15px Barlow;cursor:pointer}
    .onglets button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
    .li{width:min(100%,540px);aspect-ratio:1;background:var(--navy);color:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column}
    .li .k{font:800 15px "Barlow Condensed";color:var(--yel)}
    .li h3{font-size:30px;margin:4px 0 14px}
    .li .r{display:grid;grid-template-columns:24px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:15px;margin-bottom:7px}
    .li .r .bar{position:relative;background:var(--navy2);border-radius:4px;height:28px;overflow:hidden}
    .li .r .bar i{position:absolute;inset:0 auto 0 0;background:#3D5DC0}
    .li .r:first-of-type .bar i{background:var(--red)}
    .li .r .bar span{position:relative;padding-left:8px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
    .li .foot{margin-top:auto;font-size:13px;color:#b9c6e0}
  </style>
</head>
<body>
  <div class="top band"><div class="wrap"><img src="/img/logo/logo-horizontal.svg" alt="GAMEDOOR·41" width="196" height="28"><span style="color:#cfd8ea">Défi de Noël · écran de l'équipe</span></div></div>
  <main class="band"><div class="wrap">
    <form id="login" style="max-width:460px">
      <h2>Écran de l'équipe</h2>
      <label for="code">Code de l'équipe</label>
      <input class="in" id="code" type="password" autocomplete="current-password" style="margin:6px 0 12px">
      <button class="cta" type="submit">Ouvrir</button>
      <div id="lmsg"></div>
    </form>
    <div id="app" hidden>
      <div class="actions" style="justify-content:space-between"><h2 style="margin:0">Le défi en direct</h2><span><button class="btn-s" id="recharger">Actualiser</button> <button class="btn-s" id="csv">Télécharger les inscrits (Excel)</button></span></div>
      <div id="alerte"></div>
      <div class="stats" id="stats"></div>
      <div class="onglets" id="onglets"></div>
      <div id="vue"></div>
    </div>
  </div></main>
<script>
(function(){
  var code='',B=null,onglet='inscrits';
  try{code=localStorage.getItem('defi-noel-code')||'';}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function api(p,corps){return fetch('/api/defi-noel/equipe/'+p,{method:corps?'POST':'GET',headers:{'x-defi-code':code,'content-type':'application/json'},body:corps?JSON.stringify(corps):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j;});});}
  function date(iso){return iso?new Date(iso).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}):'';}
  document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();code=document.getElementById('code').value.trim();charger(true);});
  document.getElementById('recharger').onclick=function(){charger();};
  function charger(depuisLogin){
    api('bilan').then(function(b){B=b;try{localStorage.setItem('defi-noel-code',code);}catch(e){}document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;afficher();})
      .catch(function(j){if(depuisLogin||!B){document.getElementById('login').hidden=false;document.getElementById('app').hidden=true;document.getElementById('lmsg').className='msg err';document.getElementById('lmsg').textContent=(j&&j.message)||'Connexion impossible.';}});
  }
  if(code)charger();
  function afficher(){
    var al='';
    if(B.essai)al+='<div class="msg err">Aperçu de test : ces données sont séparées du vrai site.</div>';
    if(!B.courrier)al+='<div class="msg err"><b>Les mails ne partent pas encore.</b> Il manque la clé Brevo sur Netlify (variable BREVO_API_KEY). En attendant, les inscriptions fonctionnent et chaque inscrit voit son lien à l\'écran.</div>';
    document.getElementById('alerte').innerHTML=al;
    var joueurs=B.entreprises.reduce(function(a,e){return a+(e.joueurs||0);},0);
    var s='<div class="stat"><b>'+B.entreprises.length+'</b>entreprises inscrites</div><div class="stat"><b>'+joueurs+'</b>joueurs annoncés</div>';
    [1,2,3].forEach(function(n){s+='<div class="stat"><b>'+B.resultats[n].length+'</b>réponses pièce '+n+(B.pieces[n-1].contenu?'':' · <span style="color:var(--red)">contenu manquant</span>')+'</div>';});
    document.getElementById('stats').innerHTML=s;
    var o=[['inscrits','Inscrits'],['p1','Pièce 1'],['p2','Pièce 2'],['p3','Pièce 3'],['classement','Classement'],['linkedin','Visuel LinkedIn'],['mails','Envoyer les mails']];
    document.getElementById('onglets').innerHTML=o.map(function(x){return '<button data-o="'+x[0]+'" aria-pressed="'+(onglet===x[0])+'">'+x[1]+'</button>';}).join('');
    document.querySelectorAll('#onglets button').forEach(function(b){b.onclick=function(){onglet=b.dataset.o;afficher();};});
    var v=document.getElementById('vue');
    if(onglet==='inscrits')v.innerHTML=inscrits();
    else if(onglet[0]==='p')v.innerHTML=piece(+onglet[1]);
    else if(onglet==='classement')v.innerHTML=classement();
    else if(onglet==='linkedin')v.innerHTML=linkedin();
    else v.innerHTML=mails();
    brancher();
  }
  function inscrits(){
    if(!B.entreprises.length)return '<p>Aucune inscription pour l\'instant. Le lien à partager : <b>gamedoor41.fr/defi-noel/</b></p>';
    return '<div class="scroll"><table><thead><tr><th>Entreprise</th><th>Référent</th><th>Contact</th><th>Joueurs</th><th>Connu par</th><th>LinkedIn</th><th>Inscrite le</th><th>Lien perso</th></tr></thead><tbody>'+B.entreprises.map(function(e){return '<tr><td><b>'+esc(e.entreprise)+'</b><br>'+esc(e.ville)+'</td><td>'+esc(e.prenom+' '+e.nom)+'<br><small>'+esc(e.fonction)+'</small></td><td>'+esc(e.email)+'<br>'+esc(e.telephone)+'</td><td class="n">'+e.joueurs+'</td><td>'+esc(e.source)+'</td><td>'+(e.linkedin?'oui':'non')+'</td><td>'+date(e.cree)+'</td><td><button class="btn-s" data-copie="'+esc(e.lien)+'">Copier</button></td></tr>';}).join('')+'</tbody></table></div>';
  }
  var NOMS={enigme:'Énigme',son:'Son',q1:'Q1',q2:'Q2',q3:'Q3'};
  function piece(n){
    var R=B.resultats[n];
    if(!R.length)return '<p>Pas encore de réponse pour la pièce '+n+'. Limite : '+esc(B.pieces[n-1].limiteTexte)+'.</p>';
    return '<p>Les points sont calculés tout seuls. Une réponse originale mais juste ? Cliquez sur sa case pour changer les points.</p><div class="scroll"><table><thead><tr><th>Entreprise</th><th>Énigme</th><th>Son</th><th>Quiz</th>'+(n===3?'<th>Subsid.</th>':'')+'<th>Total</th><th>Envoyé</th></tr></thead><tbody>'+R.map(function(r){
      var d=r.correction.detail,cell=function(k,txt){var max=k==='enigme'?2:1;return '<span class="pt '+(d[k]>0?'ok':'ko')+'"><button data-n="'+n+'" data-id="'+r.id+'" data-ep="'+k+'" data-max="'+max+'" data-v="'+d[k]+'" title="Changer les points">'+d[k]+'</button> '+esc(txt)+'</span>';};
      return '<tr><td><b>'+esc(r.entreprise)+'</b></td><td>'+cell('enigme',r.reponses.enigme)+'</td><td>'+cell('son',r.reponses.son)+'</td><td>'+[0,1,2].map(function(i){return cell('q'+(i+1),(r.reponses.quiz||[])[i]);}).join('<br>')+'</td>'+(n===3?'<td class="n">'+esc(r.reponses.subsidiaire)+'</td>':'')+'<td class="n"><b>'+r.correction.total+'</b></td><td>'+date(r.maj)+(r.versions>1?'<br><small>'+r.versions+' versions</small>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';
  }
  function classement(){
    return '<p>Égalités départagées par la question subsidiaire (vraie valeur : '+B.bonnesReponsesEnigme3+' entreprises ont trouvé l\'énigme 3), puis par l\'heure d\'envoi de la pièce 3.</p><div class="scroll"><table><thead><tr><th>#</th><th>Entreprise</th><th>P1</th><th>P2</th><th>P3</th><th>Total</th><th>Écart subsid.</th></tr></thead><tbody>'+B.classement.map(function(l,i){return '<tr><td class="n">'+(i+1)+'</td><td><b>'+esc(l.entreprise)+'</b></td><td class="n">'+(l.parPiece[1]??'–')+'</td><td class="n">'+(l.parPiece[2]??'–')+'</td><td class="n">'+(l.parPiece[3]??'–')+'</td><td class="n"><b>'+l.total+'</b></td><td class="n">'+(l.ecart??'')+'</td></tr>';}).join('')+'</tbody></table></div>';
  }
  function linkedin(){
    var faites=[1,2,3].filter(function(n){return B.resultats[n].length;}).pop()||1;
    var top=B.classement.filter(function(l){return l.linkedin;}).slice(0,8),max=faites*6;
    var prochaine={1:'Prochaine pièce jeudi 10 déc.',2:'Dernière pièce jeudi 17 déc.',3:'Résultats jeudi 24 déc. à 17 h'}[faites];
    return '<p>Faites une capture de ce carré et publiez-le sur LinkedIn en identifiant les entreprises. Seules celles qui ont accepté apparaissent.</p><div class="li"><div class="k">CALENDRIER DE L\'AVENT DES ÉNIGMES</div><h3>Classement après la pièce n°'+faites+'</h3>'+top.map(function(l,i){return '<div class="r"><span style="font:800 20px \'Barlow Condensed\';color:#9fb0d0">'+(i+1)+'</span><div class="bar"><i style="width:'+Math.round(l.total/max*100)+'%"></i><span>'+esc(l.entreprise)+'</span></div><b style="text-align:right">'+l.total+' pts</b></div>';}).join('')+'<div class="foot">'+prochaine+' · Il est encore temps de rejoindre l\'enquête : gamedoor41.fr/defi-noel</div></div>';
  }
  function mails(){
    var h='<p>Chaque mail contient le lien personnel de chaque entreprise. Faites toujours un essai sur votre propre adresse avant l\'envoi à tous.</p>';
    h+='<div class="champ" style="max-width:420px"><label for="test">Adresse pour les essais</label><input class="in" id="test" type="email" value="'+esc(B.contact)+'"></div>';
    [1,2,3].forEach(function(n){h+='<h3 style="margin-top:22px">Pièce n°'+n+' — '+esc(B.pieces[n-1].titre)+'</h3><div class="actions"><button class="btn-s" data-envoi="'+n+'" data-type="piece" data-test="1">Essai sur mon adresse</button><button class="cta" style="padding:10px 16px;font-size:15px" data-envoi="'+n+'" data-type="piece">Envoyer à toutes les entreprises</button><button class="btn-s" data-envoi="'+n+'" data-type="rappel">Rappel à celles qui n\'ont pas répondu</button></div>';});
    if(B.envois.length)h+='<h3 style="margin-top:22px">Déjà envoyés</h3><ul>'+B.envois.map(function(e){return '<li>'+date(e.quand)+' · pièce '+e.n+' · '+(e.type==='rappel'?'rappel':'envoi')+' · '+e.envoyes+' mails'+(e.echecs?' · '+e.echecs+' échecs':'')+'</li>';}).join('')+'</ul>';
    return h+'<div id="emsg"></div>';
  }
  function brancher(){
    document.querySelectorAll('[data-copie]').forEach(function(b){b.onclick=function(){try{navigator.clipboard.writeText(b.dataset.copie);b.textContent='Copié';}catch(e){prompt('Lien',b.dataset.copie);}};});
    document.querySelectorAll('.pt button').forEach(function(b){b.onclick=function(){var max=+b.dataset.max,v=(+b.dataset.v+1)%(max+1);api('valider',{n:+b.dataset.n,id:b.dataset.id,epreuve:b.dataset.ep,points:v}).then(function(){charger();});};});
    document.querySelectorAll('[data-envoi]').forEach(function(b){b.onclick=function(){
      var n=+b.dataset.envoi,test=b.dataset.test?document.getElementById('test').value.trim():'',type=b.dataset.type,m=document.getElementById('emsg');
      if(!test&&!confirm(type==='rappel'?'Envoyer le rappel de la pièce '+n+' aux entreprises qui n\'ont pas répondu ?':'Envoyer la pièce '+n+' à toutes les entreprises inscrites ?'))return;
      b.disabled=true;api('envoyer',{n:n,type:type,test:test||undefined}).then(function(r){m.className='msg ok';m.textContent=r.envoyes+' mail(s) envoyé(s).'+(r.echecs&&r.echecs.length?' Problème : '+r.echecs.join(' / '):'');b.disabled=false;if(!test)charger();}).catch(function(j){m.className='msg err';m.textContent=(j&&j.message)||'Envoi impossible.';b.disabled=false;});
    };});
  }
  document.getElementById('csv').onclick=function(){
    var cols=['entreprise','ville','prenom','nom','fonction','email','telephone','joueurs','source','linkedin','cree','total'];
    var lignes=[cols.concat(['source CRM']).join(';')].concat(B.entreprises.map(function(e){var tot=(B.classement.find(function(l){return l.id===e.id;})||{}).total||0;e.total=tot;return cols.map(function(c){return '"'+String(e[c]==null?'':e[c]).replace(/"/g,'""')+'"';}).concat(['"Calendrier de l\'Avent 2026"']).join(';');}));
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lignes.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='defi-noel-inscrits.csv';a.click();
  };
})();
</script>
</body>
</html>
